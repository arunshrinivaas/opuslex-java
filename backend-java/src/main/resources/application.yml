spring:
  application:
    name: legal-compliance-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/legal_compliance_db}
    username: ${DATABASE_USER:legal_app}
    password: ${DATABASE_PASSWORD:legal_app_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET_KEY:default_secret_key_needs_to_be_long_enough_for_hs256}
  expiration: 86400000
